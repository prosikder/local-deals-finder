name: Build APKs
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug assembleReleaseTest
      - uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/releaseTest/*.apk
            app/build/outputs/mapping/releaseTest/mapping.txt
      - name: Publish APKs and Proguard Mapping to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create build-${{ github.run_number }} \
            app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/releaseTest/app-releaseTest.apk \
            app/build/outputs/mapping/releaseTest/mapping.txt \
            --title "Build ${{ github.run_number }}" \
            --notes "Debug APK, R8-minified Debug-signed ReleaseTest APK, and Proguard de-obfuscation mapping.txt, commit ${{ github.sha }}"