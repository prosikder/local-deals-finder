name: Build Debug APK
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create build-${{ github.run_number }} app/build/outputs/apk/debug/app-debug.apk --title "Build ${{ github.run_number }}" --notes "Debug APK, commit ${{ github.sha }}"